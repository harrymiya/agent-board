<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Board · 实时监控</title>
<style>
  :root{
    --bg:#0d0f11; --panel:#17191c; --border:#30343a; --text:#e2e3e5;
    --dim:#7a8499; --muted:#4a5266;
    --run:#26d07c; --err:#ff5c5c; --think:#c792ea; --wait:#e5c07b;
    --idle:#a4a9b0; --acc:#b9bdc2; --signal:#d85c52;
    --bg-glow:#272b30; --hdr-bg:rgba(13,15,17,.90); --card-b2:#101214;
  }
  /* 浅色主题 */
  [data-theme="light"]{
    --bg:#f1f1ef; --panel:#fbfbf9; --border:#d0d0cc; --text:#252628;
    --dim:#5b6675; --muted:#8b95a5;
    --run:#0f9d58; --err:#e03535; --think:#8b5cf6; --wait:#c77d0a;
    --idle:#72767b; --acc:#6d7176; --signal:#b84239;
    --bg-glow:#ffffff; --hdr-bg:rgba(251,251,249,.90); --card-b2:#eeeeec;
  }
  *{box-sizing:border-box}
  *{scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
  *::-webkit-scrollbar{width:6px;height:6px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:var(--muted);border-radius:6px}
  *::-webkit-scrollbar-thumb:hover{background:var(--dim)}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    position:relative;background:
      radial-gradient(900px 520px at 18% -12%,rgba(255,255,255,.09),transparent 58%),
      radial-gradient(760px 520px at 100% 100%,rgba(255,255,255,.035),transparent 68%),
      var(--bg);
    color:var(--text);font:14px/1.5 Inter,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  body:after{content:'';position:fixed;inset:0;pointer-events:none;z-index:30;
    background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.025) 46%,transparent 54%);
    mix-blend-mode:screen;opacity:.45}
  body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.20;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.005) 1px,transparent 2px,transparent 5px)}
  header{
    height:58px;flex:none;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:12px 22px;background:var(--hdr-bg);backdrop-filter:blur(14px) saturate(.8);
    border-bottom:1px solid rgba(255,255,255,.10);box-shadow:0 8px 28px rgba(0,0,0,.20),inset 0 -1px rgba(255,255,255,.05);
  }
  header h1{font-size:16px;font-weight:500;margin:0;letter-spacing:2.2px;text-shadow:0 1px 0 #000,0 -1px rgba(255,255,255,.10)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
  .stat{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:12px;padding-left:16px;
        border-left:1px solid rgba(180,185,190,.14);letter-spacing:.3px}
  .stat b{color:var(--text);font:600 12px/1 "SF Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  .s-run b{color:var(--run)} .s-err b{color:var(--err)}
  .s-total b{color:var(--acc)}
  .right{margin-left:auto;color:var(--dim);font:11px/1 "SF Mono",ui-monospace,Menlo,monospace;display:flex;gap:15px;align-items:center;font-variant-numeric:tabular-nums}
  .live{color:var(--run)} .live.off{color:var(--muted)}
  .live{animation:livePulse 2.2s ease-in-out infinite}
  @keyframes livePulse{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 5px var(--run))}}
  #themeBtn{margin-left:6px;width:30px;height:30px;border-radius:50%;border:1px solid rgba(190,195,200,.30);
    background:radial-gradient(circle at 35% 28%,#34383d,#151719 62%,#090a0b);color:var(--text);font-size:13px;cursor:pointer;line-height:1;
    display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px rgba(255,255,255,.14),0 3px 8px rgba(0,0,0,.35);transition:filter .2s,box-shadow .2s}
  #themeBtn:hover{filter:brightness(1.18);box-shadow:inset 0 1px rgba(255,255,255,.18),0 4px 12px rgba(0,0,0,.45)}
  #themeBtn:focus-visible{outline:1px solid var(--acc);outline-offset:3px}
  [data-theme="light"] #themeBtn{background:radial-gradient(circle at 35% 28%,#fff,#dededa 65%,#bbb);color:#27292b;box-shadow:inset 0 1px #fff,0 3px 8px rgba(0,0,0,.18)}

  /* 页面自身不滚动，工作区和事件流各自滚动 */
  .board-layout{height:calc(100vh - 58px);display:grid;grid-template-columns:minmax(0,1fr) 6px var(--done-width,270px);min-height:0}
  .left-layout{min-width:0;min-height:0;display:flex;flex-direction:column}
  main{position:relative;height:calc(100% - var(--events-height, 230px) - 3px);min-height:150px;flex:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
       perspective:1400px;
       align-content:start;gap:14px;padding:17px 22px 20px;overflow:auto;overscroll-behavior:contain}

  .done-panel{display:flex;flex-direction:column;border-left:1px solid rgba(210,214,218,.24);background:linear-gradient(90deg,rgba(255,255,255,.045),transparent 8px),linear-gradient(180deg,rgba(255,255,255,.055),rgba(0,0,0,.10) 70%);box-shadow:inset 1px 0 rgba(255,255,255,.05),-12px 0 30px rgba(0,0,0,.14);min-height:0}
  .panel-title{display:flex;align-items:center;gap:9px;padding:16px 16px 14px;color:var(--text);
               font-size:10px;font-weight:600;letter-spacing:1.7px;border-bottom:1px solid var(--border);flex:none}
  .panel-title:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--signal);box-shadow:0 0 7px color-mix(in srgb,var(--signal) 55%,transparent)}
  .panel-title b{color:var(--text);font-size:11px;line-height:20px;min-width:22px;text-align:center;margin-left:auto;
                 border:1px solid var(--border);border-radius:11px;background:var(--panel)}
  #doneList{position:relative;overflow:auto;padding:9px 10px 18px;min-height:0;overscroll-behavior:contain}
  #doneList:after{content:'';position:fixed;right:18px;bottom:18px;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.16);box-shadow:0 -8px rgba(255,255,255,.08),0 -16px rgba(255,255,255,.04);pointer-events:none}
  .done-row{position:relative;display:flex;align-items:center;gap:10px;min-height:42px;padding:8px 10px;
            margin-bottom:3px;border:1px solid transparent;border-radius:4px;cursor:default}
  .done-row{transition:transform .25s ease,background .25s ease,border-color .25s ease,box-shadow .25s ease}
  .done-row:hover{background:var(--panel);border-color:var(--border);box-shadow:0 7px 18px rgba(0,0,0,.18);transform:translateX(-3px)}
  .done-mark{display:flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
             color:var(--bg);background:var(--idle);font:700 11px/1 sans-serif;flex:none}
  .done-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:11px/1.35 "SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.1px;flex:1}
  .done-time{color:var(--muted);font:9.5px/1 "SF Mono",ui-monospace,Menlo,monospace;flex:none}
  .empty-panel{color:var(--muted);font-size:12px;padding:22px 10px;line-height:1.7}

  .splitter{flex:none;z-index:4;background:var(--border);position:relative}
  .splitter:hover,.splitter.dragging{background:var(--acc)}
  .splitter:hover:after,.splitter.dragging:after{background:#d9f0ff;box-shadow:0 0 8px var(--acc)}
  #hSplitter{height:3px;cursor:row-resize}
  #vSplitter{width:6px;cursor:col-resize;background:transparent}
  #hSplitter:after{content:'';position:absolute;left:50%;top:0;width:34px;height:2px;transform:translateX(-50%);border-radius:3px;background:var(--muted)}
  #vSplitter:after{content:'';position:absolute;left:1px;top:50%;width:3px;height:34px;transform:translateY(-50%);border-radius:3px;background:var(--muted)}

  .card{
    position:relative;background:linear-gradient(145deg,rgba(255,255,255,.045),transparent 28%),linear-gradient(180deg,var(--panel),var(--card-b2));
    border:1px solid rgba(180,185,190,.22);border-radius:6px;
    overflow:hidden;display:flex;flex-direction:column;
    min-height:200px;max-height:240px;
    transform-style:preserve-3d;will-change:transform,opacity,box-shadow;
    box-shadow:0 8px 20px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.08);
  }
  .card:before{content:'';position:absolute;z-index:0;inset:-30% -55%;pointer-events:none;
    background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.20) 49%,rgba(220,224,228,.07) 51%,transparent 58%);
    transform:translateX(-70%) rotate(8deg);transition:transform 3.5s cubic-bezier(.2,.75,.25,1)}
  /* 悬浮不再改卡片自身 transform，避免与实时 FLIP 排序动画互相抢控制权 */
  .card:after{content:'';position:absolute;z-index:0;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(240px circle at var(--mx,50%) var(--my,35%),rgba(255,255,255,.14),rgba(255,255,255,.035) 34%,transparent 68%);
    mix-blend-mode:screen;transition:opacity .45s ease}
  .card:hover{border-color:rgba(205,210,215,.46);filter:brightness(1.045);
    box-shadow:0 12px 28px rgba(0,0,0,.30),0 0 18px rgba(220,224,228,.055),inset 0 1px rgba(255,255,255,.14)}
  .card:hover:before{transform:translateX(70%) rotate(8deg)}
  .card:hover:after{opacity:1}
  /* 卡片出现 / 消失 / 移动 的丝滑动效 */
  .card{transition:transform .45s cubic-bezier(.22,.8,.28,1),opacity .45s ease,
                    box-shadow .3s ease;will-change:transform,opacity}
  .card.enter{animation:cardIn .45s cubic-bezier(.22,.8,.28,1)}
  .card.leaving{pointer-events:none;opacity:0;transform:scale(.86) translateY(8px);
                transition:opacity .28s ease,transform .28s ease}
  @keyframes cardIn{
    from{opacity:0;transform:translateY(14px) scale(.96)}
    to  {opacity:1;transform:translateY(0)   scale(1)}
  }
  /* 状态仅通过头部底色淡染区分(不再给卡片底边/彩色边框) */
  .card.x-run .c-head{background:linear-gradient(90deg,rgba(38,208,124,.10),transparent 68%)}
  .card.x-err .c-head{background:linear-gradient(90deg,rgba(255,92,92,.12),transparent 68%)}
  .card.x-think .c-head{background:linear-gradient(90deg,rgba(199,146,234,.10),transparent 68%)}
  .card.x-wait .c-head{background:linear-gradient(90deg,rgba(229,192,123,.10),transparent 68%)}
  .card.x-idle .c-head{background:transparent}

  .c-head{position:relative;z-index:1;display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--border);min-width:0}
  /* 印章式 agent 名牌: 矩形厚边框 + 品牌色半透明印 + 轻旋转 */
  .c-brand{flex:none;font-weight:800;font-size:11px;letter-spacing:1px;text-transform:uppercase;
           padding:2px 8px;border:1px solid rgba(205,210,215,.28);border-radius:2px;
           transform:none;line-height:1.35;font-family:ui-monospace,Menlo,Consolas,monospace;
           color:#c8ccd0!important;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.12))!important;
           box-shadow:inset 0 1px rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.25)!important}
  .c-brand.b-hermes{color:#9d7bff;background:rgba(124,58,237,.18);box-shadow:0 0 0 1px rgba(124,58,237,.18)}

  .c-brand.b-opencode{color:#3fe08c;background:rgba(38,208,124,.14);box-shadow:0 0 0 1px rgba(38,208,124,.14)}
  .c-brand.b-codex{color:#f0a84e;background:rgba(217,119,6,.16);box-shadow:0 0 0 1px rgba(217,119,6,.16)}
  .c-brand.b-pi{color:#56c8e6;background:rgba(14,116,144,.20);box-shadow:0 0 0 1px rgba(14,116,144,.20)}
  .c-brand.b-prime{color:#c9a2ff;background:rgba(129,61,206,.20);box-shadow:0 0 0 1px rgba(129,61,206,.20)}
  .c-brand.b-other{color:var(--dim);background:var(--border);box-shadow:0 0 0 1px var(--border)}
  [data-theme="light"] .c-brand.b-hermes{color:#6b3fe0;background:#ede7ff;box-shadow:0 0 0 1px #ede7ff}
  [data-theme="light"] .c-brand.b-opencode{color:#0f9d58;background:#dff7e9;box-shadow:0 0 0 1px #dff7e9}
  [data-theme="light"] .c-brand.b-codex{color:#b45309;background:#fdeeda;box-shadow:0 0 0 1px #fdeeda}
  [data-theme="light"] .c-brand.b-pi{color:#0e7490;background:#daf4fa;box-shadow:0 0 0 1px #daf4fa}
  [data-theme="light"] .c-brand.b-prime{color:#6d28d9;background:#efe9fe;box-shadow:0 0 0 1px #efe9fe}
  [data-theme="light"] .c-brand{color:#484b4f!important;background:linear-gradient(#fff,#e7e7e4)!important}
  .c-name{font:650 13px/1.35 "SF Mono",ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 状态像设备指示灯：暗色铭牌 + 小范围自发光 */
  .c-badge{margin-left:auto;font:700 9.5px/1 "SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.8px;
           padding:5px 8px;border-radius:3px;background:rgba(0,0,0,.28);border:1px solid currentColor;text-shadow:none;box-shadow:inset 0 1px rgba(255,255,255,.05)}
  .x-run .c-badge{color:var(--run);box-shadow:inset 0 1px rgba(255,255,255,.05),0 0 8px rgba(38,208,124,.14)}
  .x-err .c-badge{color:var(--err);box-shadow:inset 0 1px rgba(255,255,255,.05),0 0 8px rgba(255,92,92,.16)}
  .x-think .c-badge{color:var(--think);box-shadow:inset 0 1px rgba(255,255,255,.05),0 0 8px rgba(199,146,234,.14)}
  .x-wait .c-badge{color:var(--wait);box-shadow:inset 0 1px rgba(255,255,255,.05),0 0 8px rgba(229,192,123,.14)}
  .x-idle .c-badge{color:var(--idle)}

  .c-cmd{position:relative;z-index:1;display:block;color:var(--muted);font-size:11px;padding:0 12px 8px;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;flex:none;font-family:"SF Mono",ui-monospace,Menlo,monospace}

  .c-body{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;padding:2px 12px 12px;overflow:hidden;font-family:"SF Mono",ui-monospace,Menlo,monospace}
  .think-line{display:flex;gap:7px;font-size:12px;color:var(--text)}
  .think-line .t-ts{color:var(--dim);flex:none;font-size:11px;min-width:36px}
  .think-line .t-txt{color:var(--text);overflow:hidden;display:-webkit-box;
        -webkit-line-clamp:2;-webkit-box-orient:vertical;
        word-break:break-all}
  .x-think .t-txt{color:var(--think)}
  .c-empty{color:var(--muted);font-size:12px;padding:4px 0}
  .c-body>.c-empty{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}

  .c-foot{position:relative;z-index:1;margin-top:auto;display:flex;gap:12px;padding:8px 12px;
          color:var(--dim);font-size:11.5px;flex-wrap:wrap;min-width:0;overflow:hidden;max-height:40px;
          background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 65%)}
  .c-foot b{color:var(--text);font-weight:500}

  /* cron 特有 */
  .cron-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:var(--text)}
  .cron-row .lab{color:var(--muted)}
  .cron-err{color:var(--err);font-size:11.5px;margin-top:4px;word-break:break-all;max-height:36px;overflow:hidden}

  .events{height:var(--events-height, 230px);min-height:120px;display:flex;flex-direction:column;
          margin:0;padding:8px 0 12px 22px;min-width:0;background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 25%)}
  .events h2{font-size:10px;font-weight:600;color:var(--dim);letter-spacing:1.8px;margin:0 0 7px;
             text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:8px}
  #evList{overflow-y:auto;overflow-x:hidden;min-height:0;min-width:0;padding-right:0;overscroll-behavior:contain}
  .ev{display:flex;align-items:center;gap:10px;min-width:0;padding:5px 12px 5px 0;font:11px/1.45 "SF Mono",ui-monospace,Menlo,monospace;border-bottom:1px solid rgba(150,155,160,.13);transition:background .2s,transform .2s}
  .ev:hover{background:rgba(255,255,255,.045);transform:translateX(3px)}
  .ev .e-ts{color:var(--muted);flex:none;width:54px}
  .ev .e-ag{color:var(--acc);flex:none;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev .e-ste{color:var(--dim);min-width:54px;text-transform:lowercase}
  .ev .e-ms{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev.x-err .e-ste{color:var(--err)}
  .ev.x-run .e-ste{color:var(--run)}
  .ev.x-think .e-ste{color:var(--think)}
  .ev.x-wait .e-ste{color:var(--wait)}

  .none{grid-column:1/-1;color:var(--muted);text-align:center;padding:48px 40px;border:1px solid rgba(180,185,190,.14);
        border-radius:6px;background:linear-gradient(145deg,rgba(255,255,255,.025),transparent);letter-spacing:.5px}
  .think-popover{position:fixed;z-index:20;display:none;width:min(560px,calc(100vw - 24px));max-height:min(360px,calc(100vh - 24px));
                 overflow:auto;padding:12px 14px;background:rgba(18,20,22,.96);backdrop-filter:blur(16px) saturate(.8);
                 border:1px solid rgba(205,210,215,.30);border-radius:6px;
                 box-shadow:0 18px 46px rgba(0,0,0,.52),inset 0 1px rgba(255,255,255,.08),inset 0 -1px rgba(0,0,0,.5);pointer-events:none}
  .think-popover.show{display:block}
  .pop-title{color:#c9cdd1;font-size:10.5px;margin-bottom:8px;letter-spacing:1.4px;text-transform:uppercase}
  .pop-line{display:flex;gap:9px;padding:3px 0;color:var(--text);font:11px/1.5 "SF Mono",ui-monospace,Menlo,monospace}
  .pop-ts{color:var(--dim);flex:none}
  [data-theme="light"] .think-popover{background:rgba(250,250,247,.96);border-color:rgba(80,84,88,.24);
    box-shadow:0 18px 42px rgba(35,37,39,.18),inset 0 1px #fff,inset 0 -1px rgba(0,0,0,.06)}
  [data-theme="light"] .pop-title{color:#55595e}
  @media(max-width:700px){
    .board-layout{grid-template-columns:minmax(0,1fr) 6px 190px}
    main{grid-template-columns:1fr;padding:12px}
    .events{padding-left:12px;padding-right:0}
  }
  @media(prefers-reduced-motion:reduce){
    .card,.card:before,.card:after,.done-row,.ev,.live{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<header>
  <h1><span class="dot live" id="liveDot"></span>Agent Board</h1>
  <div class="stat s-total">活跃 <b id="stTotal">0</b></div>
  <div class="stat s-run">运行 <b id="stRun">0</b></div>
  <div class="stat s-err">异常 <b id="stErr">0</b></div>
  <div class="stat">事件 <b id="stEvents">0</b></div>
  <div class="right"><span id="runLabel">run=–</span><span id="clock">– –</span>
    <button id="themeBtn" type="button" title="切换深浅主题" aria-label="切换主题">◐</button></div>
</header>
<div class="board-layout">
  <div class="left-layout">
    <main id="grid"></main>
    <div id="hSplitter" class="splitter" role="separator" aria-label="调整事件流高度"></div>
    <div class="events"><h2>事件流</h2><div id="evList"></div></div>
  </div>
  <div id="vSplitter" class="splitter" role="separator" aria-label="调整完成列表宽度"></div>
  <aside class="done-panel"><div class="panel-title"><span>已完成 AGENT</span><b id="doneCount">0</b></div><div id="doneList"></div></aside>
</div>
<div id="thinkPopover" class="think-popover" aria-hidden="true"></div>

<script>
const grid=document.getElementById('grid');
const $=id=>document.getElementById(id);

/* ── 深浅主题切换(localStorage 记忆) ── */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeBtn').textContent = (t==='light' ? '◑' : '◐');
}
(function initTheme(){
  const saved = localStorage.getItem('agentboard-theme');
  applyTheme(saved==='light' ? 'light' : 'dark');
  document.getElementById('themeBtn').addEventListener('click', ()=>{
    const cur = document.documentElement.getAttribute('data-theme');
    const next = (cur==='light') ? 'dark' : 'light';
    applyTheme(next);
    localStorage.setItem('agentboard-theme', next);
  });
})();

const fmtDur=s=>{s=+s||0;const h=(s/3600)|0,m=((s%3600)/60)|0,se=s%60;
  return (h?h+'h'+String(m).padStart(2,'0')+'m':m?m+'m'+String(se).padStart(2,'0')+'s':se+'s');};

function cls(a){const g=(a&&a.cls&&a.cls.group)||'idle';
  // 后端 group 是完整词(running/error/thinking/waiting), CSS 用短 class 名(run/err/think/wait)
  const map={running:'run',error:'err',thinking:'think',waiting:'wait'};
  return map[g]||g;}
function esc(t){t=String(t==null?'':t);return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')
   .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function thinkBlock(a){
  if(a.type==='cron') return '';
  const th=(a.think||[]).slice(-3).reverse();
  if(!th.length) return '<div class="c-empty">— 暂无思维链 —</div>';
  const lines=th.map(t=>`<div class="think-line"><span class="t-ts">${esc(t.ts)}</span>`+
    `<span class="t-txt">${esc(t.text)}</span></div>`).join('');
  return lines||'<div class="c-empty">— 暂无思维链 —</div>';
}

function cronBody(a){
  const r=[];const row=(lab,v)=>`<div class="cron-row"><span class="lab">${lab}</span><span>${esc(v)}</span></div>`;
  if(a.state!=null&&a.state!='')r.push(row('state',a.state));
  if(a.sched)r.push(row('schedule',a.sched));
  if(a.next_run)r.push(row('next',a.next_run));
  if(a.last_run)r.push(row('last',a.last_run));
  const th=(a.think||[]).slice(-1);
  const tbt=th.length?`<div class="think-line"><span class="t-ts">${esc(th[0].ts)}</span><span class="t-txt">${esc(th[0].text)}</span></div>`:'';
  const err=a.err?`<div class="cron-err">✘ ${esc(a.err)}</div>`:'';
  return r.join('')+tbt+err;
}

function brandOf(agent){
  const n=String(agent||'').toLowerCase();
  if(/^hermes/.test(n)) return 'hermes';
  if(/^opencode/.test(n)) return 'opencode';
  if(/^codex/.test(n)) return 'codex';
  if(/^pi[\s-_.]/.test(n)) return 'pi';
  if(/^prime/.test(n)) return 'prime';
  return 'other';
}
function brandHTML(agent){
  const b=brandOf(agent);
  if(b==='other') return ''; // 未知类型不显示印章
  return `<span class="c-brand b-${b}">${b}</span>`;
}

function cardHTML(a){
  const g=cls(a);
  const c=String(a.agent||'');
  const sub=[];
  const foot=[];
  if(a.pid!=null && a.pid!=='')foot.push(`<span>pid <b>${a.pid==='0'?'会话':esc(a.pid)}</b></span>`);
  if(a.dur!=null)foot.push(`<span>时长 <b class="dur" data-agent="${esc(c)}">${fmtDur(a.dur)}</b></span>`);
  if(a.last&&a.last.stage)foot.push(`<span>阶段 <b>${esc(a.last.stage)}</b></span>`);
  if(a.last&&a.last.ts)foot.push(`<span>${esc(a.last.ts)}</span>`);
  const lastMsg=a.last&&a.last.msg?`<div class="c-empty">· ${esc(a.last.msg)}</div>`:'';
  return `<section class="card x-${g}" data-agent="${esc(c)}" data-think="${esc(JSON.stringify(a.think||[]))}">
    <div class="c-head">${brandHTML(c)}
      <span class="c-name" title="${esc(c)}">${esc(c)}</span>
      <span class="c-badge">${esc(a.cls&&a.cls.label||'IDLE')}</span></div>
    ${a.cmd?`<div class="c-cmd" title="${esc(a.cmd)}">${esc(a.cmd)}</div>`:''}
    <div class="c-body">${a.type==='cron'?cronBody(a):thinkBlock(a)}${lastMsg}</div>
    <div class="c-foot">
      ${foot.join('')}
      ${a.type==='cron'&&a.last_run?`<span>上次 <b>${esc(a.last_run)}</b></span>`:''}
    </div>
  </section>`;
}

function isDone(a){return String(a.cls&&a.cls.label||'').toUpperCase()==='DONE';}
function doneRowHTML(a){
  const last=(a.think||[]).slice(-1)[0];
  return `<div class="done-row" data-agent="${esc(a.agent)}" data-think="${esc(JSON.stringify(a.think||[]))}">
    <span class="done-mark">✓</span><span class="done-name" title="${esc(a.agent)}">${esc(a.agent)}</span>
    ${last&&last.ts?`<span class="done-time">${esc(last.ts)}</span>`:''}</div>`;
}
function renderDone(agents){
  const lastTs=a=>{const t=(a.think||[]).slice(-1)[0];return String(t&&t.ts||a.last&&a.last.ts||'');};
  const done=agents.filter(isDone).sort((a,b)=>lastTs(b).localeCompare(lastTs(a)));
  $('doneCount').textContent=done.length;
  $('doneList').innerHTML=done.length?done.map(doneRowHTML).join(''):'<div class="empty-panel">暂无已完成 agent</div>';
}

function render(d){
  $('stTotal').textContent=d.stats.total;
  $('stRun').textContent=d.stats.running;
  $('stErr').textContent=d.stats.error;
  $('stEvents').textContent=d.stats.events;
  $('runLabel').textContent='run='+d.run;
  const active=(d.agents||[]).filter(a=>!isDone(a));
  renderDone(d.agents||[]);
  const empty=grid.querySelector('.none');
  if(!active.length){
    _clearBody();
    if(!empty){
      const state=document.createElement('div');
      state.className='none';
      state.textContent='当前没有活动的 agent —— 有则自动呈现';
      grid.appendChild(state);
    }
    return;
  }
  if(empty)empty.remove();
  // ── FLIP 增量更新: 卡片消失/出现/移动各自丝滑动效, 不整页重绘 ──
  const prev = new Map();                        // agent -> element
  grid.querySelectorAll('.card').forEach(el=>prev.set(el.dataset.agent, el));
  const oldRects = new Map();
  [...prev.values()].forEach(el=>oldRects.set(el.dataset.agent, el.getBoundingClientRect()));
  const newSet = new Set(active.map(a=>a.agent));

  // 1) 消失的卡: 保留在原位播放退场动效, 动画结束后自移除
  prev.forEach((el,id)=>{ if(!newSet.has(id)){
    el.classList.add('leaving');
    const rm=()=>el.remove();
    el.addEventListener('transitionend',rm,{once:true});
    el.addEventListener('animationend',rm,{once:true});
    setTimeout(rm,520); // 兜底
  }});

  // 2) 按最新顺序重排: appendChild 移动/插入, 不触发整车重绘
  active.forEach(a=>{
    let el = prev.get(a.agent);
    const sig = _sig(a);
    if(el && !el.classList.contains('leaving')){
      if(el.dataset.sig !== sig) el = _updateCard(el, a, sig);  // 内容变化才原位刷新
    } else {
      const div=document.createElement('div');
      div.innerHTML=cardHTML(a);
      el=div.firstChild;
      el.dataset.sig = sig;
      el.classList.add('enter');
    }
    grid.appendChild(el);   // 已存在的会移动到最后(完成重排), 新增的按序插入
  });

  // 3) 移动的卡: FLIP 平滑滑到新位置
  grid.querySelectorAll('.card').forEach(el=>{
    if(el.classList.contains('leaving')) return;
    const old = oldRects.get(el.dataset.agent);
    if(!old) return;
    const nr = el.getBoundingClientRect();
    const dx = old.left - nr.left, dy = old.top - nr.top;
    if(dx || dy){
      el.style.transition='none';
      el.style.transform=`translate(${dx}px,${dy}px)`;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        el.style.transition='';
        el.style.transform='';
      }));
    }
  });
}
function _sig(a){
  // 轻量签名: 忽略本地自增的 dur, 其余变化都触发内容刷新
  const o={}; for(const k in a){ if(k!=='dur') o[k]=a[k]; }
  return JSON.stringify(o);
}
function _updateCard(el, a, sig){
  const div=document.createElement('div');
  div.innerHTML=cardHTML(a);
  const fresh=div.firstChild;
  fresh.dataset.sig = sig;
  el.replaceWith(fresh);   // 原位替换, 保持网格位置, 不动画(避免每帧闪烁)
  return fresh;
}
function _clearBody(){
  grid.querySelectorAll('.card').forEach(el=>{
    el.classList.add('leaving');
    setTimeout(()=>el.remove(),260);
  });
}
function renderEvents(d){
  const l=document.getElementById('evList');
  // 事件流只展示最新信息，不把历史日志当作滚动内容保留在底部
  const events=(d.events||[]).slice(0,12);
  const html=!events.length?'<div class="ev">— 暂无事件 —</div>':events.map(e=>`<div class="ev x-${cls(e)}">
    <span class="e-ts">${esc(e.ts)}</span>
    <span class="e-ag">${esc(e.agent)}</span>
    <span class="e-ste">${esc(e.status)}</span>
    <span class="e-ms">${esc(e.msg)}</span></div>`).join('');
  /* 最新事件在顶部，刷新时回到顶部，避免旧的滚动位置露出残留行 */
  l.innerHTML=html;
  l.scrollTop=0;
}
/* 页面级思维链浮层：滚动卡片区时也不会被容器裁掉 */
const thinkPopover=$('thinkPopover');
function showThink(el){
  let items=[];try{items=JSON.parse(el.dataset.think||'[]');}catch(_){}
  if(!items.length){thinkPopover.classList.remove('show');return;}
  const recent=items.slice(-40);
  thinkPopover.innerHTML='<div class="pop-title">最近完整思维链 · '+esc(el.dataset.agent||'')+'</div>'+recent.map(t=>
    `<div class="pop-line"><span class="pop-ts">${esc(t.ts||'')}</span><span>${esc(t.text||'')}</span></div>`).join('');
  thinkPopover.classList.add('show');thinkPopover.setAttribute('aria-hidden','false');
  const r=el.getBoundingClientRect(),p=thinkPopover.getBoundingClientRect(),gap=8;
  let left=Math.min(Math.max(12,r.left),window.innerWidth-p.width-12),top=r.bottom+gap;
  if(top+p.height>window.innerHeight-12)top=Math.max(12,r.top-p.height-gap);
  thinkPopover.style.left=left+'px';thinkPopover.style.top=top+'px';
}
function hideThink(){thinkPopover.classList.remove('show');thinkPopover.setAttribute('aria-hidden','true');}
document.addEventListener('mouseover',e=>{
  const el=e.target.closest('.card,.done-row');
  const prev=e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.card,.done-row');
  if(el&&el!==prev)showThink(el);
});
document.addEventListener('mouseout',e=>{const from=e.target.closest('.card,.done-row'),to=e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.card,.done-row');if(from&&!to)hideThink();});
document.addEventListener('pointermove',e=>{
  const card=e.target.closest('.card');if(!card)return;
  const r=card.getBoundingClientRect();
  card.style.setProperty('--mx',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');
  card.style.setProperty('--my',((e.clientY-r.top)/r.height*100).toFixed(1)+'%');
});

/* 两条分隔线都支持拖拽 */
const rootStyle=document.documentElement.style;
function setupSplitters(){
  const hs=$('hSplitter'),vs=$('vSplitter');let drag=null;
  const begin=(type,e)=>{drag={type,start:type==='h'?e.clientY:e.clientX,base:parseFloat(getComputedStyle(document.documentElement).getPropertyValue(type==='h'?'--events-height':'--done-width'))||(type==='h'?230:270)};(type==='h'?hs:vs).classList.add('dragging');document.body.style.userSelect='none';e.preventDefault();};
  hs.addEventListener('pointerdown',e=>{hs.setPointerCapture(e.pointerId);begin('h',e);});
  vs.addEventListener('pointerdown',e=>{vs.setPointerCapture(e.pointerId);begin('v',e);});
  window.addEventListener('pointermove',e=>{if(!drag)return;if(drag.type==='h')rootStyle.setProperty('--events-height',Math.max(120,Math.min(window.innerHeight-210,drag.base+drag.start-e.clientY))+'px');else rootStyle.setProperty('--done-width',Math.max(190,Math.min(window.innerWidth*.45,drag.base+drag.start-e.clientX))+'px');});
  window.addEventListener('pointerup',()=>{if(!drag)return;hs.classList.remove('dragging');vs.classList.remove('dragging');document.body.style.userSelect='';drag=null;});
}
setupSplitters();

function tickClock(){const n=new Date();$('clock').textContent=
  String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');}

let data=null,off=0;
function apply(d){data=d;off=0;render(data);renderEvents(data);$('liveDot').classList.remove('off');}
// ── WebSocket 实时推送(优先), 失败时回退到轮询 ──
let ws=null,wsOk=false,pollTimer=null;
function connectWS(){
  try{
    const proto=location.protocol==='https:'?'wss':'ws';
    ws=new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen=()=>{wsOk=true;stopPoll();};
    ws.onmessage=e=>{try{apply(JSON.parse(e.data));}catch(_){}};
    ws.onclose=()=>{wsOk=false;startPoll();};
    ws.onerror=()=>{try{ws.close();}catch(_){}};
  }catch(e){startPoll();}
}
function startPoll(){if(pollTimer)return;pollTimer=setInterval(poll,200);poll();}
function stopPoll(){if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}
async function poll(){
  try{
    const r=await fetch('/api/data',{cache:'no-store'});
    if(!r.ok)throw 0; apply(await r.json());
  }catch(e){$('liveDot').classList.add('off');}
}
connectWS();
setInterval(tickClock,1000); tickClock();
// 若 6 秒内 WS 未连上, 自动切轮询兜底
setTimeout(()=>{if(!wsOk)startPoll();},6000);
// 时长本地递增(避免仅依赖轮询)
setInterval(()=>{if(!data||!data.agents)return;
  document.querySelectorAll('.card .dur').forEach(el=>{
    const a=data.agents.find(x=>String(x.agent)===el.dataset.agent);
    if(a&&typeof a.dur==='number')el.textContent=fmtDur(a.dur+(1));
  });},1000);
</script>
</body>
